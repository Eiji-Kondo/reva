name: Musl Build ARMv7

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Run LDAP, LDAPS, WebDAV, and share tests with static musl binaries
        run: |
          docker run --rm --platform linux/arm/v7 \
            -e MUSL_BUILD=1 \
            -v "$PWD:/workspace" \
            -w /workspace \
            golang:1.25.8-bookworm \
            bash tests/ldap/ci-armv7.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: revad-armv7-musl
          path: ./cmd/revad/revad

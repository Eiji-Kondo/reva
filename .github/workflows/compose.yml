name: Compose
on:
  workflow_call:
    inputs:
      test:
        required: true
        type: string
      image:
        type: string
      download:
        type: boolean
      submodules:
        type: boolean
      parts:
        type: number
      part:
        type: number

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}
      - name: Download image
        uses: ishworkh/docker-image-artifact-download@v1
        if: inputs.download
        with:
          image: ${{ inputs.image }}
      - name: Test
        run: make ${{ inputs.test }}
        env:
          REVAD_IMAGE: ${{ inputs.image }}
          PARTS: ${{ inputs.parts }}
          PART: ${{ inputs.part }}
      - name: Logs
        if: failure()
        run: docker compose -f ./tests/docker/docker-compose.yml logs --no-color --timestamps
        env:
          EOS_FULL_IMAGE: eos-full
      - name: Clean
        if: always()
        run: make docker-clean
        env:
          REVAD_IMAGE: ${{ inputs.image }}
